info:
  title: API Docs
  description: Custom Swagger UI in NestJS
  version: '1'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    BaseResponse:
      type: object
      properties:
        statusCode:
          type: number
          enum:
            - 100
            - 101
            - 102
            - 103
            - 200
            - 201
            - 202
            - 203
            - 204
            - 205
            - 206
            - 207
            - 208
            - 210
            - 300
            - 301
            - 302
            - 303
            - 304
            - 307
            - 308
            - 400
            - 401
            - 402
            - 403
            - 404
            - 405
            - 406
            - 407
            - 408
            - 409
            - 410
            - 411
            - 412
            - 413
            - 414
            - 415
            - 416
            - 417
            - 418
            - 421
            - 422
            - 423
            - 424
            - 428
            - 429
            - 456
            - 500
            - 501
            - 502
            - 503
            - 504
            - 505
            - 507
            - 508
          example: 200
          description: HTTP status code
        message:
          type: string
          example: OK
          description: Response message
        data:
          type: object
          description: Response data (null if no data)
          nullable: true
        error:
          type: object
          description: Error information (null on success)
        errorCode:
          type: string
          enum:
            - validation_failed
            - unauthenticated
            - unauthorized
            - http_error
            - unknown_error
            - token_expired
            - invalid_token
            - not_any_recipient
            - send_mail_failed
            - consumer_not_found
            - consumer_failed
            - process_failed
            - otp_already_exist
            - otp_spam
            - otp_expired
            - otp_incorrect
            - invalid_decode_token
            - invalid_token_issuer
            - VerificationNotFound
            - VerificationSessionExpired
            - AccountNotFound
            - ExistedEmail
            - ExistedPhoneNumber
            - ExistedUsername
            - InvalidEmailOrPassword
            - InvalidTokenSecret
            - FileNotFound
            - FileTooLarge
            - InvalidFileType
            - InvalidFileName
            - EmailAlreadyExists
            - UsernameAlreadyExists
            - FanProfileNotFound
            - IdolProfileNotFound
            - ChatChannelNotFound
            - NotChannelParticipant
            - NotChannelAdmin
            - CannotSendToAnnouncementChannel
            - InternalServerError
            - IdolNotFound
            - PostNotFound
            - PostNotOwned
            - CommentNotFound
            - CommentNotOwned
            - CommentNotBelongToPost
            - CommunityNotFound
            - AlreadyJoinedCommunity
            - NotJoinedCommunity
            - ChatChannelRetrievalFailed
            - ChatMessageRetrievalFailed
            - ChatMessageSendFailed
            - ChatChannelAccessDenied
            - InvalidChannelId
            - KnockTokenGenerationFailed
            - KnockNotificationSendFailed
            - KnockWorkflowTriggerFailed
            - KnockUserUpsertFailed
            - KnockPreferencesFetchFailed
            - KnockPreferencesUpdateFailed
            - KnockChannelDataUpdateFailed
            - KnockPushChannelNotConfigured
            - KnockFcmTokenRegistrationFailed
            - InvalidFcmToken
            - UserNotFound
          description: Error code (optional)
      required:
        - statusCode
        - message
    SignInResponse:
      type: object
      properties:
        id:
          type: string
          example: '1'
          description: User ID
        role:
          type: string
          example: FAN
          description: User role
          enum:
            - FAN
            - ADMIN
            - IDOL
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: JWT access token
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: JWT refresh token
      required:
        - id
        - role
        - accessToken
        - refreshToken
    VerificationCodeResponse:
      type: object
      properties:
        waitSeconds:
          type: number
          description: Wait time in seconds
          example: 60
        expireAt:
          type: number
          description: Expired at verification timestamp
          example: 1740412406898
      required:
        - waitSeconds
        - expireAt
    ConfirmVerificationResponse:
      type: object
      properties:
        id:
          type: string
          example: '1'
          description: User ID
        name:
          type: string
          example: Leon
          description: User name
          nullable: true
        email:
          type: string
          example: example@gmail.com
          description: User email
        role:
          type: string
          example: FAN
          description: User role
          enum:
            - FAN
            - ADMIN
            - IDOL
      required:
        - id
        - email
        - role
    SignInRequest:
      type: object
      properties:
        email:
          type: string
          example: example@gmail.com
          description: Your email
        password:
          type: string
          example: Password@123456
          description: Your password
      required:
        - email
        - password
    SignUpRequest:
      type: object
      properties:
        email:
          type: string
          example: example@gmail.com
          description: Your email
        password:
          type: string
          example: Password@123456
          description: Your password
        username:
          type: string
          example: johndoe
          description: Your username
      required:
        - email
        - password
        - username
    SendVerificationRequest:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
          description: Your email address
        verificationType:
          type: string
          enum:
            - FIND_EMAIL
            - RESET_PASSWORD
            - REGISTER_ACCOUNT
            - UPDATE_PROFILE
          description: Verification behavior
          example: REGISTER_ACCOUNT
      required:
        - email
        - verificationType
    ConfirmVerificationRequest:
      type: object
      properties:
        email:
          type: string
          example: example@gmail.com
          description: Your email address
        code:
          type: string
          description: Your verification code
          example: '0303'
        verificationType:
          type: string
          enum:
            - FIND_EMAIL
            - RESET_PASSWORD
            - REGISTER_ACCOUNT
            - UPDATE_PROFILE
          description: Verification type
          example: FIND_EMAIL
      required:
        - email
        - code
        - verificationType
    RefreshTokenRequest:
      type: object
      properties:
        token:
          type: string
          description: Your access token
          example: >-
            eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEsImlhdCI6MTY4ODUwMjM0NSwiZXhwIjoxNjg4NTg4NzQ1fQ.7mXhKfXlqH3p0nO2b8jv8XzF1Zz5Y9bX5tF8vZ6xQ
        refreshToken:
          type: string
          description: Your refresh token
          example: >-
            eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEsImlhdCI6MTY4ODUwMjM0NSwiZXhwIjoxNjg4NTg4NzQ1fQ.7mXhKfXlqH3p0nO2b8jv8XzF1Zz5Y9bX5tF8vZ6xQ
      required:
        - token
        - refreshToken
    ResetPasswordRequest:
      type: object
      properties:
        password:
          type: string
          example: Password@123456
          description: Your new password
        email:
          type: string
          example: example@gmail.com
          description: Your email address
      required:
        - password
        - email
    UploadFileResponse:
      type: object
      properties:
        url:
          type: string
          description: Public URL of the uploaded file
          example: https://storage.googleapis.com/my-bucket/posts/file-uuid.jpg
        fileName:
          type: string
          description: Name of the uploaded file
          example: file-uuid.jpg
        filePath:
          type: string
          description: Full path of the file in storage
          example: posts/file-uuid.jpg
        size:
          type: number
          description: Size of the file in bytes
          example: 102400
        mimeType:
          type: string
          description: MIME type of the file
          example: image/jpeg
        uploadedAt:
          format: date-time
          type: string
          description: Upload timestamp
          example: '2025-11-06T08:00:00.000Z'
      required:
        - url
        - fileName
        - filePath
        - size
        - mimeType
        - uploadedAt
    GetFileUrlResponse:
      type: object
      properties:
        url:
          type: string
          description: Public URL of the file
          example: https://storage.googleapis.com/my-bucket/posts/file-uuid.jpg
      required:
        - url
    GetSignedUrlResponse:
      type: object
      properties:
        signedUrl:
          type: string
          description: Signed URL for temporary access
          example: >-
            https://storage.googleapis.com/my-bucket/posts/file-uuid.jpg?X-Goog-Algorithm=...
        expiresAt:
          format: date-time
          type: string
          description: Expiration time of the signed URL
          example: '2025-11-06T09:00:00.000Z'
      required:
        - signedUrl
        - expiresAt
    UploadFileRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: File to upload
        folder:
          type: string
          enum:
            - profiles
            - posts
            - attachments
            - documents
            - thumbnails
            - temp
          description: Folder to upload the file to
          example: posts
        customFileName:
          type: string
          description: Custom file name (optional)
          example: my-custom-name
      required:
        - file
        - folder
        - customFileName
    UserDto:
      type: object
      properties:
        id:
          type: string
          description: User ID
          example: user_123
        name:
          type: string
          description: User name
          example: John Doe
