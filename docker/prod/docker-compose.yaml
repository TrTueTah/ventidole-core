services:
  postgres:
    image: postgres:17
    container_name: ventidole-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ventidole
      POSTGRES_USER: trantanh227
      POSTGRES_PASSWORD: Tanhdeptrai113
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trantanh227 -d ventidole']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ventidole-network

  server:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: ventidole-server
    env_file:
      - ../../.env
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - ventidole-network

volumes:
  postgres_data:

networks:
  ventidole-network:
    external: true
